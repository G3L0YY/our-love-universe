
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baby 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 50%, #4b176d 0%, #1a0630 35%, #07000f 75%);
    color: white;
}

/* Galaxy background */
.galaxy {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Stars */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* Main container */
.container {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    z-index: 5;
}

/* Card */
.card {
    width: 90%;
    max-width: 600px;

    padding: 45px 30px;

    background: rgba(50, 10, 75, 0.45);
    border: 1px solid rgba(220, 160, 255, 0.3);

    border-radius: 30px;

    backdrop-filter: blur(12px);

    box-shadow:
        0 0 30px rgba(180, 80, 255, 0.3),
        inset 0 0 30px rgba(255, 255, 255, 0.03);

    animation: appear 2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Heart */
.heart {
    font-size: 90px;

    filter:
        drop-shadow(0 0 10px #ff8cff)
        drop-shadow(0 0 30px #b84cff);

    animation: heartbeat 1.3s infinite;
}

@keyframes heartbeat {
    0% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.2);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.15);
    }

    70% {
        transform: scale(1);
    }
}

/* Title */
h1 {
    margin-top: 20px;

    font-size: clamp(30px, 7vw, 55px);

    background: linear-gradient(
        90deg,
        #ffffff,
        #e6a8ff,
        #ffffff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 20px rgba(220, 120, 255, 0.4);
}

/* Text */
#message {
    min-height: 70px;

    margin-top: 20px;

    font-size: 18px;
    line-height: 1.6;

    color: #f2dcff;
}

/* Button */
button {
    margin-top: 25px;

    padding: 14px 30px;

    border: none;
    border-radius: 30px;

    background: linear-gradient(
        90deg,
        #7b2cbf,
        #c77dff
    );

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(199, 125, 255, 0.5);

    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 30px rgba(220, 150, 255, 0.8);
}

/* Floating hearts */
.floating-heart {
    position: fixed;

    bottom: -50px;

    font-size: 25px;

    pointer-events: none;

    animation: floatUp linear forwards;

    z-index: 2;
}

@keyframes floatUp {
    0% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(0.8);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.4);

        opacity: 0;
    }
}

/* Shooting star */
.shooting-star {
    position: fixed;

    width: 120px;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        white
    );

    transform: rotate(-35deg);

    opacity: 0;

    animation: shooting 5s linear infinite;
}

@keyframes shooting {

    0% {
        top: 5%;
        left: 100%;
        opacity: 0;
    }

    5% {
        opacity: 1;
    }

    20% {
        top: 45%;
        left: -20%;
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

/* Secret message */
.secret {
    display: none;

    margin-top: 25px;

    font-size: 20px;
    color: #ffd6ff;

    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Mobile */
@media (max-width: 600px) {

    .card {
        padding: 35px 20px;
    }

    .heart {
        font-size: 70px;
    }

    #message {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- Galaxy -->
<div class="galaxy" id="galaxy"></div>

<!-- Shooting star -->
<div class="shooting-star"></div>

<!-- Main content -->
<div class="container">

    <div class="card">

        <div class="heart">
            💜
        </div>

        <h1>
            For My Baby
        </h1>

        <p id="message"></p>

        <button onclick="showLove()">
            💌 Press Me
        </button>

        <div class="secret" id="secret">
            You are my favorite person in this universe. 💜
            <br><br>
            I love you endlessly pima. 🌌✨
            
        </div>

    </div>

</div>


<script>

/* =========================================
   CREATE RANDOM STARS
========================================= */

const galaxy = document.getElementById("galaxy");

for (let i = 0; i < 180; i++) {

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    galaxy.appendChild(star);
}


/* =========================================
   TYPING MESSAGE
========================================= */

const text =
"Out of all the stars in the universe, I would still choose you. 💜";

let index = 0;

function typeText() {

    if (index < text.length) {

        document.getElementById("message").innerHTML +=
            text.charAt(index);

        index++;

        setTimeout(typeText, 55);
    }
}

setTimeout(typeText, 1000);


/* =========================================
   FLOATING HEARTS
========================================= */

function createHeart() {

    const heart = document.createElement("div");

    heart.classList.add("floating-heart");

    const hearts = [
        "💜",
        "💗",
        "💖",
        "💕",
        "✨",
        "💘"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        (Math.random() * 20 + 15) + "px";

    heart.style.animationDuration =
        (Math.random() * 5 + 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}


/* Create hearts continuously */

setInterval(createHeart, 700);


/* =========================================
   BUTTON
========================================= */

function showLove() {

    const secret =
        document.getElementById("secret");

    secret.style.display = "block";

    // Create a burst of hearts
    for (let i = 0; i < 20; i++) {

        setTimeout(() => {
            createHeart();
        }, i * 100);
    }
}


/* =========================================
   CLICK ANYWHERE = HEART
========================================= */

document.addEventListener("click", function(event) {

    if (event.target.tagName === "BUTTON") {
        return;
    }

    const heart =
        document.createElement("div");

    heart.innerHTML = "💜";

    heart.style.position = "fixed";

    heart.style.left =
        event.clientX + "px";

    heart.style.top =
        event.clientY + "px";

    heart.style.fontSize = "25px";

    heart.style.pointerEvents = "none";

    heart.style.zIndex = "100";

    heart.style.transition =
        "1s ease";

    document.body.appendChild(heart);

    setTimeout(() => {

        heart.style.transform =
            "translateY(-80px) scale(1.5)";

        heart.style.opacity = "0";

    }, 50);

    setTimeout(() => {
        heart.remove();
    }, 1100);

});

</script>

</body>
</html>
